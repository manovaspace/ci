name: secret-scan

# Reusable per-push secret scan for a caller repository: gitleaks over the commits each push adds,
# on every branch, without the full gate. It runs the pinned ci/gitleaks.sh from manovaspace/ci.
# See templates/secret-scan.yml.
on:
  workflow_call:
    inputs:
      ci-ref:
        description: "manovaspace/ci ref to read the gitleaks pin from"
        required: false
        type: string
        default: "v1"

jobs:
  gitleaks:
    if: github.event.deleted != true
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Full history, so the commits of a push and origin/main are present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # manovaspace/ci is public: no token, and the caller's credentials are not used for it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: manovaspace/ci
          ref: ${{ inputs.ci-ref }}
          path: .ci-kit
          persist-credentials: false

      - name: gitleaks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)
              # A new branch (all-zero before) or a force push whose old tip is no longer fetched:
              # scan everything the branch adds on top of main. Otherwise scan before..after.
              # origin/main comes from the full-history checkout above; fetch it only when absent.
              if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                git rev-parse --verify --quiet origin/main >/dev/null || git fetch --no-tags origin main
                range="origin/main..${AFTER}"
              else
                range="${BEFORE}..${AFTER}"
              fi
              bash .ci-kit/ci/gitleaks.sh --range "$range" .
              ;;
            pull_request)
              bash .ci-kit/ci/gitleaks.sh --range "origin/${BASE_REF}..HEAD" .
              ;;
            *)
              bash .ci-kit/ci/gitleaks.sh .
              ;;
          esac

name: release-check

# Release-tier gate: the Go tests that need real dependencies (PostgreSQL, Redis, NATS JetStream)
# and must not skip themselves silently. It needs service containers and docker, so it runs on
# `vars.CI_RUNNER` when that names the self-hosted pool (the GCP runners, label `vps`, which run
# service containers) and on a GitHub-hosted runner otherwise.
on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory to check"
        required: false
        type: string
        default: "."
      migrations-glob:
        description: "Glob of goose migration files to lint with squawk; empty disables"
        required: false
        type: string
        default: ""
    secrets:
      GH_READ_TOKEN:
        description: "Read token for private github.com/manovaspace modules and siblings"
        required: false
      NPM_TOKEN:
        description: "Read token for the @orbit scope"
        required: false

jobs:
  release-check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    # Host ports are random and read back from job.services: two jobs share one self-hosted VM,
    # so fixed host ports would collide.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # NATS needs -js, and a service container cannot take command arguments, so run it here.
      # The container name and host port are per run, so concurrent jobs on one VM do not collide.
      - name: start nats
        run: |
          set -euo pipefail
          name="release-check-nats-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          echo "NATS_CONTAINER=$name" >>"$GITHUB_ENV"
          docker run -d --name "$name" -p 127.0.0.1::4222 nats:2.14-alpine -js
          port="$(docker port "$name" 4222/tcp | head -n 1 | sed 's/.*://')"
          echo "NATS_PORT=$port" >>"$GITHUB_ENV"
          for _ in $(seq 30); do
            if nc -z localhost "$port"; then
              exit 0
            fi
            sleep 1
          done
          echo "release-check: nats did not accept connections on $port within 30s" >&2
          docker logs "$name" || true
          exit 1

      - uses: manovaspace/ci@v1
        with:
          stack: go
          tier: release
          working-directory: ${{ inputs.working-directory }}
          migrations-glob: ${{ inputs.migrations-glob }}
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
          TEST_NATS_URL: nats://localhost:${{ env.NATS_PORT }}

      - name: stop nats
        if: always()
        run: |
          if [ -n "${NATS_CONTAINER:-}" ]; then
            docker rm -f "$NATS_CONTAINER" >/dev/null 2>&1 || true
          fi

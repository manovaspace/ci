name: secret-scan

# The kit's own per-push secret scan. secret-scan.yml in this repository is the reusable workflow
# that other repositories call, so this caller runs it here against the pushed kit commit. The
# check is named "secret-scan / gitleaks", which the orbit merge gate expects on feature PRs.
on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
    with:
      ci-ref: ${{ github.sha }}

name: CI

# Dev-stage gate (ADR-076): the full check runs only on pushes to the release branches
# (release-please, Changesets) and the dependency branches (Renovate), and on a manual dispatch.
# It is triggered by push, not pull_request: GitHub cannot filter pull_request by head branch, so a
# pull_request trigger leaves a skipped check row on every pull request. A push run attaches its
# checks to the open pull request's head commit. Other pushes are covered by the local pre-push gate
# and the secret-scan workflow. Copy this file to .github/workflows/ of the repository and commit it.
on:
  push:
    branches: ["release-please--**", "changeset-release/**", "renovate/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'push' && github.ref_name || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'release-please--') || startsWith(github.ref_name, 'changeset-release/') || startsWith(github.ref_name, 'renovate/')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: manovaspace/ci@v1
        with:
          stack: __STACK__
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

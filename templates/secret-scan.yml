name: secret-scan

# Per-push secret scan: gitleaks over the commits each push adds, on every branch. It is the
# server-side half of the dev-stage gate; the full CI runs only on release and dependency pull
# requests. Copy this file to .github/workflows/ of the repository and commit it.
on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  secret-scan:
    uses: manovaspace/ci/.github/workflows/secret-scan.yml@v1
